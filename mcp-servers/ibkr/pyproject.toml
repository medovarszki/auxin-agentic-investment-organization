[project]
name = "auxin-mcp-ibkr"
version = "0.1.0"
description = "Auxin IBKR MCP server: read-only tools over the ibkrfacade REST API"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "httpx==0.28.1",
    "uvicorn==0.54.0",
]

[project.scripts]
auxin-mcp-ibkr = "auxin_mcp_ibkr.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auxin_mcp_ibkr"]
