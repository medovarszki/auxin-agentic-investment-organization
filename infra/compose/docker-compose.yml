# Agents as A2A servers on an internal network, tasks in one shared Postgres table, broker data through the
# IBKR MCP server (phase 6.1), memory in the knowledge service (phase 6.2).
# Run from the repo root: make up / make scan / make tasks (see Makefile).
name: auxin

networks:
  agents:
    internal: true        # no route to the internet
  egress: {}
  # The ibkrfacade project's internal network (make ibkr-up creates it). Only the IBKR MCP server joins it.
  ibkr-backend:
    external: true

volumes:
  pgdata: {}

# Values come from the repo-root .env (the Makefile passes --env-file .env); each container
# gets only the variables it needs.
x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:?set in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
  POSTGRES_DB: ${POSTGRES_DB:?set in .env}

# LLM agents: subscription token, Claude API through the proxy, MCP servers and the knowledge REST.
x-llm-env: &llm-env
  <<: *db-env
  # Subscription quota only (Mihály); ANTHROPIC_API_KEY is never passed to a container.
  CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?set in .env (claude setup-token)}
  # Only the Claude API goes through the proxy; A2A, MCP and Postgres stay on the internal network.
  HTTPS_PROXY: http://egress-proxy:3128
  HTTP_PROXY: http://egress-proxy:3128
  NO_PROXY: localhost,127.0.0.1,postgres,market-sentiment,research,portfolio-manager,execution,mcp-ibkr,knowledge
  AUXIN_MCP_IBKR_URL: http://mcp-ibkr:8000/mcp
  AUXIN_MCP_KNOWLEDGE_BASE_URL: http://knowledge:8000/mcp
  AUXIN_KNOWLEDGE_URL: http://knowledge:8000

x-llm-depends: &llm-depends
  egress-proxy: {condition: service_started}
  postgres: {condition: service_healthy}
  mcp-ibkr: {condition: service_started}
  knowledge: {condition: service_healthy}

x-agent-hardening: &agent-hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  tmpfs:
    - /tmp:size=64m
    - /home/agent:size=128m,uid=10001,gid=10001
  networks: [agents]
  restart: unless-stopped
  cpus: 1
  mem_limit: 1g

services:
  egress-proxy:
    image: ubuntu/squid:6.6-24.04_edge
    volumes:
      - ../egress/squid.conf:/etc/squid/squid.conf:ro
      - ../egress/allowlist.txt:/etc/squid/allowlist.txt:ro
    networks: [agents, egress]
    cpus: 0.5
    mem_limit: 256m

  # Shared database: A2A task store (a2a_tasks) and the knowledge base tables (owned by the knowledge service).
  postgres:
    image: postgres:18.6
    environment: *db-env
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [agents]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    cpus: 1
    mem_limit: 512m

  market-sentiment:
    <<: *agent-hardening
    build:
      context: ../..
      dockerfile: agents/market-sentiment/Dockerfile
    image: auxin-market-sentiment
    environment: *llm-env
    depends_on: *llm-depends

  research:
    <<: *agent-hardening
    build:
      context: ../..
      dockerfile: agents/research/Dockerfile
    image: auxin-research
    environment: *llm-env
    depends_on: *llm-depends

  portfolio-manager:
    <<: *agent-hardening
    build:
      context: ../..
      dockerfile: agents/portfolio-manager/Dockerfile
    image: auxin-portfolio-manager
    environment: *llm-env
    depends_on: *llm-depends

  # Deterministic, no LLM, no Claude token. The only Auxin container besides mcp-ibkr on ibkr-backend: it alone
  # reaches ibkrfacade's order endpoint (IBKR write access, CLAUDE.md).
  execution:
    <<: *agent-hardening
    build:
      context: ../..
      dockerfile: agents/execution/Dockerfile
    image: auxin-execution
    environment:
      <<: *db-env
      IBKRFACADE_URL: http://ibkrfacade:8082/ibkr
      AUXIN_KNOWLEDGE_URL: http://knowledge:8000
    networks: [agents, ibkr-backend]
    depends_on:
      postgres: {condition: service_healthy}
      knowledge: {condition: service_healthy}

  # Read-only IBKR tools over ibkrfacade (no token for now, Mihály); the LLM agents never reach ibkrfacade directly.
  mcp-ibkr:
    <<: *agent-hardening
    build:
      context: ../..
      dockerfile: mcp-servers/ibkr/Dockerfile
    image: auxin-mcp-ibkr
    environment:
      IBKRFACADE_URL: http://ibkrfacade:8082/ibkr
    networks: [agents, ibkr-backend]
    cpus: 0.5
    mem_limit: 256m

  # Knowledge base (decisions, company_notes, lessons): REST for the deterministic writers, MCP (/mcp) with
  # read-only tools for the agents. Applies its Alembic migrations on start. No auth for now (Mihály).
  knowledge:
    <<: *agent-hardening
    build:
      context: ../..
      dockerfile: services/knowledge/Dockerfile
    image: auxin-knowledge
    environment: *db-env
    depends_on:
      postgres: {condition: service_healthy}
    cpus: 0.5
    mem_limit: 256m

  # One-shot sender for manual triggers: make scan. Not a long-running service.
  operator:
    <<: *agent-hardening
    image: auxin-agent-base
    restart: "no"
    profiles: [tools]
