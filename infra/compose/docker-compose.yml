# Agents as A2A servers on an internal network, tasks in one shared Postgres table, broker data through the
# IBKR MCP server (phase 6.1), memory in the knowledge service (phase 6.2).
# Run from the repo root: make up / make scan / make tasks (see Makefile).
name: auxin

networks:
  agents:
    internal: true        # no route to the internet
  egress: {}
  # The ibkrfacade project's internal network (make ibkr-up creates it). Only the IBKR MCP server joins it.
  ibkr-backend:
    external: true
  # Only for publishing the Jaeger and dashboard UIs to localhost: ports cannot be published on an internal network.
  ui: {}

volumes:
  pgdata: {}

# Values come from the repo-root .env (the Makefile passes --env-file .env); each container
# gets only the variables it needs.
x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:?set in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
  POSTGRES_DB: ${POSTGRES_DB:?set in .env}

# Traces (OTLP/HTTP) straight to Jaeger, no collector (phase 7); without the variable tracing is off.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

# LLM agents: subscription token, Claude API through the proxy, MCP servers and the knowledge REST.
x-llm-env: &llm-env
  <<: [*db-env, *otel-env]
  # Subscription quota only (Mihály); ANTHROPIC_API_KEY is never passed to a container.
  CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?set in .env (claude setup-token)}
  # Only the Claude API goes through the proxy; A2A, MCP and Postgres stay on the internal network.
  HTTPS_PROXY: http://egress-proxy:3128
  HTTP_PROXY: http://egress-proxy:3128
  NO_PROXY: localhost,127.0.0.1,postgres,research,portfolio-manager,execution,mcp-ibkr,knowledge,jaeger
  AUXIN_MCP_IBKR_URL: http://mcp-ibkr:8000/mcp
  AUXIN_MCP_KNOWLEDGE_BASE_URL: http://knowledge:8000/mcp
  AUXIN_KNOWLEDGE_URL: http://knowledge:8000

x-llm-depends: &llm-depends
  egress-proxy: {condition: service_started}
  postgres: {condition: service_healthy}
  mcp-ibkr: {condition: service_started}
  knowledge: {condition: service_healthy}

x-agent-hardening: &agent-hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  tmpfs:
    - /tmp:size=64m
    - /home/agent:size=128m,uid=10001,gid=10001
  networks: [agents]
  restart: unless-stopped
  cpus: 1
  mem_limit: 1g

services:
  egress-proxy:
    image: ubuntu/squid:6.6-24.04_edge
    volumes:
      - ../egress/squid.conf:/etc/squid/squid.conf:ro
      - ../egress/allowlist.txt:/etc/squid/allowlist.txt:ro
    networks: [agents, egress]
    cpus: 0.5
    mem_limit: 256m

  # Shared database: A2A task store (a2a_tasks) and the knowledge base tables (owned by the knowledge service).
  postgres:
    image: postgres:18.6
    environment: *db-env
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [agents]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    cpus: 1
    mem_limit: 512m

  research:
    <<: *agent-hardening
    build:
      context: ../..
      dockerfile: agents/research/Dockerfile
    image: auxin-research
    environment: *llm-env
    depends_on: *llm-depends

  portfolio-manager:
    <<: *agent-hardening
    build:
      context: ../..
      dockerfile: agents/portfolio-manager/Dockerfile
    image: auxin-portfolio-manager
    environment: *llm-env
    depends_on: *llm-depends

  # Deterministic, no LLM, no Claude token. The only Auxin container besides mcp-ibkr on ibkr-backend: it alone
  # reaches ibkrfacade's order endpoint (IBKR write access, CLAUDE.md).
  execution:
    <<: *agent-hardening
    build:
      context: ../..
      dockerfile: agents/execution/Dockerfile
    image: auxin-execution
    environment:
      <<: [*db-env, *otel-env]
      IBKRFACADE_URL: http://ibkrfacade:8082/ibkr
      AUXIN_KNOWLEDGE_URL: http://knowledge:8000
    networks: [agents, ibkr-backend]
    depends_on:
      postgres: {condition: service_healthy}
      knowledge: {condition: service_healthy}

  # Read-only IBKR tools over ibkrfacade (no token for now, Mihály); the LLM agents never reach ibkrfacade directly.
  mcp-ibkr:
    <<: *agent-hardening
    build:
      context: ../..
      dockerfile: mcp-servers/ibkr/Dockerfile
    image: auxin-mcp-ibkr
    environment:
      IBKRFACADE_URL: http://ibkrfacade:8082/ibkr
    networks: [agents, ibkr-backend]
    cpus: 0.5
    mem_limit: 256m

  # Knowledge base (decisions, company_notes, lessons): REST for the deterministic writers, MCP (/mcp) with
  # read-only tools for the agents. Applies its Alembic migrations on start. No auth for now (Mihály).
  knowledge:
    <<: *agent-hardening
    build:
      context: ../..
      dockerfile: services/knowledge/Dockerfile
    image: auxin-knowledge
    environment: *db-env
    depends_on:
      postgres: {condition: service_healthy}
    cpus: 0.5
    mem_limit: 256m

  # Timed triggers on workdays (Europe/Budapest): 09:00 scan, 15:30 review, 21:00 evaluate (decision evaluator).
  # Deterministic: no Claude token, no IBKR access; A2A and the knowledge REST on the internal network only.
  scheduler:
    <<: *agent-hardening
    build:
      context: ../..
      dockerfile: services/scheduler/Dockerfile
    image: auxin-scheduler
    environment:
      <<: *otel-env
      AUXIN_KNOWLEDGE_URL: http://knowledge:8000
    depends_on:
      knowledge: {condition: service_healthy}
      research: {condition: service_started}
      portfolio-manager: {condition: service_started}
      execution: {condition: service_started}
    cpus: 0.5
    mem_limit: 256m

  # Trace backend: Jaeger v2 all-in-one, in-memory storage (lost on restart; the audit is the Postgres task store
  # and decision log). OTLP/HTTP on 4318 inside the agents network, UI on localhost:16686 only.
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    environment:
      JAEGER_LISTEN_HOST: 0.0.0.0
    networks: [agents, ui]
    ports: ["127.0.0.1:16686:16686"]
    read_only: true
    tmpfs: [/tmp:size=64m]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m

  # Dashboard: JSON API + one static page on localhost:8080. Postgres in read-only sessions, the portfolio live
  # through mcp-ibkr; no Claude token, no ibkrfacade access. Its one action: a scan_trigger to Research (A2A,
  # PAPER account only, one at a time), followed live from the task store and the agent_activity table.
  dashboard:
    <<: *agent-hardening
    build:
      context: ../..
      dockerfile: services/dashboard/Dockerfile
    image: auxin-dashboard
    environment:
      <<: *db-env
      AUXIN_MCP_IBKR_URL: http://mcp-ibkr:8000/mcp
      AUXIN_JAEGER_UI_URL: http://localhost:16686
    networks: [agents, ui]
    ports: ["127.0.0.1:8080:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      mcp-ibkr: {condition: service_started}
    cpus: 0.5
    mem_limit: 256m

  # One-shot sender for manual triggers: make scan. Not a long-running service.
  operator:
    <<: *agent-hardening
    image: auxin-agent-base
    environment:
      <<: *otel-env
    restart: "no"
    profiles: [tools]
