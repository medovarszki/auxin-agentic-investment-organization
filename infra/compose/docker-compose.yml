# Phase 5: agents as A2A servers on an internal network, tasks in one shared Postgres table.
# Run from the repo root: make up / make scan / make tasks (see Makefile).
name: auxin

networks:
  agents:
    internal: true        # no route to the internet
  egress: {}

volumes:
  pgdata: {}

# Values come from the repo-root .env (the Makefile passes --env-file .env); each container
# gets only the variables it needs.
x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:?set in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
  POSTGRES_DB: ${POSTGRES_DB:?set in .env}

x-agent-hardening: &agent-hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  tmpfs:
    - /tmp:size=64m
    - /home/agent:size=128m,uid=10001,gid=10001
  networks: [agents]
  restart: unless-stopped
  cpus: 1
  mem_limit: 1g

services:
  egress-proxy:
    image: ubuntu/squid:6.6-24.04_edge
    volumes:
      - ../egress/squid.conf:/etc/squid/squid.conf:ro
      - ../egress/allowlist.txt:/etc/squid/allowlist.txt:ro
    networks: [agents, egress]
    cpus: 0.5
    mem_limit: 256m

  # Shared A2A task store (table a2a_tasks); later also portfolio mirror and knowledge base.
  postgres:
    image: postgres:18.6
    environment: *db-env
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [agents]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    cpus: 1
    mem_limit: 512m

  market-sentiment:
    <<: *agent-hardening
    build:
      context: ../..
      dockerfile: agents/market-sentiment/Dockerfile
    image: auxin-market-sentiment
    environment:
      <<: *db-env
      # Subscription quota only (Mihály); ANTHROPIC_API_KEY is never passed to a container.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?set in .env (claude setup-token)}
      # Only the Claude API goes through the proxy; A2A and Postgres stay on the internal network.
      HTTPS_PROXY: http://egress-proxy:3128
      HTTP_PROXY: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1,postgres,market-sentiment,research
    depends_on:
      egress-proxy: {condition: service_started}
      postgres: {condition: service_healthy}

  research:
    <<: *agent-hardening
    build:
      context: ../..
      dockerfile: agents/research/Dockerfile
    image: auxin-research
    environment: *db-env
    depends_on:
      postgres: {condition: service_healthy}

  # One-shot sender for manual triggers: make scan. Not a long-running service.
  operator:
    <<: *agent-hardening
    image: auxin-agent-base
    restart: "no"
    profiles: [tools]
