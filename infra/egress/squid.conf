# Egress proxy: agents have no direct internet route (internal network); everything goes
# through here and only hosts in allowlist.txt are reachable. Every request is logged.
http_port 3128

acl allowlist dstdomain "/etc/squid/allowlist.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow allowlist
http_access deny all

cache deny all
# squid runs as 'proxy' and cannot open /dev/stdout; the image entrypoint tails these files to stdout.
access_log stdio:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
pid_filename none
