# Portfólió-szabályok – a Portfolio Manager kapuja ezeket alkalmazza.
# A szabályok determinisztikusan ellenőrizhetők (rule-check), az agent nem írhatja felül őket.
# Módosítás csak Mihály jóváhagyásával. Felülvizsgálat: a szektorszabály ideiglenes.
version: 1
effective_from: 2026-10-14

universe:
  asset_classes: [stock, etf]
  regions: global
  long_only: true            # nincs short; az eladás csak csökkentés vagy zárás (Execution: SELL <= tartott mennyiség)

instrument:
  # Egyértelmű azonosítás: mindegyik kötelező, az ISIN ha elérhető
  required_fields: [ibkr_conid, symbol, exchange, currency]
  optional_fields: [isin]
  require_market_price: true   # Execution visszadobja, ha nincs árinformáció

entry:
  min_upside_pct: 15.0
  # upside = (target_price - market_price) / market_price * 100
  # market_price: az aktuális piaci ár a PM döntésének pillanatában, a célárral azonos devizában

position:
  max_new_position_weight_pct: 10.0
  # weight = position_market_value / NAV * 100, a megbízás teljesülése utáni becsült állapotra

sector:
  # IBKR ContractDetails.industry (pl. "Technology"); nincs külön adatszolgáltató, ezért nem GICS
  classification: IBKR_industry
  max_sector_weight_pct: 25.0
  # Egy új pozíció vagy növelés nem viheti a szektor összsúlyát a limit fölé.
  # Minden ETF (szektor-ETF is) a diversified kategóriába esik: az IBKR industry ETF-eknél üres
  # (Mihály, 2026-10-16, 1.b). A szektorsúlyba csak a részvények számítanak.
  etf_treatment:
    sector_etf: diversified
    broad_etf: diversified
  diversified_bucket:
    sector_limit_applies: false
    position_limit_applies: true          # a 10%-os pozíciólimit rájuk is érvényes
  review_note: "Ideiglenes szabály, később felülvizsgálandó."

risk_bucket:
  # A cég kockázatossága szerinti 4 kategória (Mihály, 2026-10-22). A besorolás a PM ítélete (skill: risk-bucket),
  # a vételi orderrel együtt a döntési naplóba kerül; a limitet a runtime-kapu ellenőrzi, mint a szektorlimitet.
  # weight = a bucket pozícióinak piaci értéke / NAV * 100 (a NAV a cash-t is tartalmazza), részvény és ETF egyaránt.
  # Bucket nélküli régi pozíció (a szabály előtt vett) nem számít bele.
  classification: pm_judgement
  buckets:
    1: {name: stabil, max_weight_pct: 25.0}         # nagy, nyereséges, alacsony volatilitás; széles index-ETF
    2: {name: mérsékelt, max_weight_pct: 25.0}      # nyereséges, piaci átlag körüli volatilitás; szektor-ETF
    3: {name: növekedési, max_weight_pct: 25.0}     # gyors növekedés vagy ciklikus, átlag feletti volatilitás
    4: {name: spekulatív, max_weight_pct: 25.0}     # veszteséges / korai szakasz, kis cég, bináris kimenetek
  # Mind a 4 bucket <= 25% NAV (Mihály, 2026-10-22): a cash a puffer, teljes befektetettség csak tökéletes egyensúlynál.

rejections:
  max_rounds_per_item: 2       # utána az ötlet / javaslat failed

approvals:
  # Tech demo, csak paper számla: nincs emberi jóváhagyás (Mihály, 2026-10-14). Élő számlánál újra true.
  human_approval_before_every_order: false
  paper_account_only: true

orders:
  default_type: MKT
  task_timeout_minutes: 60    # a napi review taszkja (review_trigger): 240
  automatic_retry: false
