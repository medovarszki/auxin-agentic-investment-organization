[project]
name = "auxin-schemas"
version = "0.1.0"
description = "Auxin message metadata, task state machine and domain models"
requires-python = ">=3.12"
dependencies = ["pydantic==2.14.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auxin_schemas"]
