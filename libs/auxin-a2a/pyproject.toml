[project]
name = "auxin-a2a"
version = "0.1.0"
description = "Auxin A2A layer: agent server, client and the shared Postgres task store"
requires-python = ">=3.12"
dependencies = [
    "auxin-schemas",
    "a2a-sdk[http-server,postgresql]==1.2.2",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[tool.uv.sources]
auxin-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auxin_a2a"]
