# Vázlat (1. fázis). Modell-ID, egress és limitek a 2. és 4. fázisban véglegesek.
name: portfolio-manager
unit: core
role: Portfóliókapu a szabályfájl szerint, pozícióméretezés, heti pozíció-review.
model: claude-opus-5-5
skills: [rule-check, position-sizing, portfolio-review]
tools:
  # csak olvasó IBKR toolok; a megbízásleadás tool nincs az allowlistben
  allow: [mcp__ibkr__get_positions, mcp__ibkr__get_price, mcp__ibkr__get_account_summary, mcp__ibkr__get_contract, mcp__knowledge-base__search]
mcp_servers: [ibkr, knowledge-base]
messages:
  consumes: [proposal, review_result, verify_result, fill, order_reject, review_trigger]
  produces: [proposal_reject, order_draft, verify_request, order, review_request]
permissions: {ibkr: read, knowledge_base: read}
egress: []
schedule:
  - {name: weekly-position-review, cron: "0 7 * * 1"}
limits: {max_concurrent_tasks: 1, max_turns: 60}
budget: {daily_usd: 15}
