name: portfolio-manager
unit: core
role: Ötlet-validáció és -challenge a portfólió ismeretében (előszűrés, kutatás), befektetési döntés (BUY a saját javaslattal / REJECT, indoklással); a szabálykaput és a méretezést a runtime alkalmazza; napi review (runtime) a Research újraértékelése alapján.
model: claude-opus-5-5
# 2026-10-26: idea-challenge (a Researchtől átvéve, a proposal-review helyett); risk-bucket. A napi review (6.4)
# determinisztikus: a Research javaslatát a runtime hajtja végre, LLM-hívás nélkül
skills: [idea-challenge, risk-bucket]
tools:
  # WebSearch / WebFetch: szerver-oldali (Anthropic API) a challenge-hez; csak olvasó IBKR toolok, megbízás-tool
  # nincs (az Execution adja le)
  allow: [WebSearch, WebFetch, mcp__ibkr__get_positions, mcp__ibkr__get_price, mcp__ibkr__get_account_summary, mcp__ibkr__get_contract, mcp__ibkr__search_contract, mcp__ibkr__get_history, mcp__ibkr__get_news, mcp__knowledge-base__*]
mcp_servers: [ibkr, knowledge-base]
messages:
  consumes: [idea, review_result, review_trigger]
  produces: [idea_reject, proposal_reject, order, review_request, execute_pending]
permissions: {ibkr: read, knowledge_base: read}
egress: []
schedule:
  - {name: daily-position-review, cron: "30 15 * * 1-5"}  # Europe/Budapest
limits: {max_concurrent_tasks: 1, max_turns: 80}
