name: research
unit: core
role: Ötlet-kritika és research → javaslat vagy elutasítás; napi pozíció-újraértékelés (HOLD / REDUCE / CLOSE); később tanulságok.
model: claude-opus-5-5
# 6.3: idea-challenge; 6.4: position-review; a tanulság-írás (6.5) skillje a saját fázisában jön
skills: [idea-challenge, position-review]
tools:
  # WebSearch / WebFetch: szerver-oldali (Anthropic API), a 4. fázisban ellenőrizve
  allow: [WebSearch, WebFetch, mcp__ibkr__get_price, mcp__ibkr__get_history, mcp__ibkr__get_news, mcp__ibkr__get_contract, mcp__ibkr__search_contract, mcp__knowledge-base__*]
mcp_servers: [ibkr, knowledge-base]
messages:
  consumes: [idea, review_request, decision_outcome]
  produces: [proposal, idea_reject, review_result, lesson]
permissions: {ibkr: read, knowledge_base: read}  # a tudásbázisba a runtime ír a strukturált kimenetből
egress: []
limits: {max_concurrent_tasks: 2, max_turns: 80}
budget: {daily_usd: 30}
