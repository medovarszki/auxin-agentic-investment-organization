name: research
unit: core
role: "Napi piaci összkép, narratíva és 0–3 befektetési ötlet a PM-nek (az ötletet a PM challenge-eli, 2026-10-26); napi pozíció-újraértékelés HOLD / REDUCE / CLOSE; tanulság a lezárt pozíciókból."
model: claude-sonnet-5-5  # Mihály, 2026-10-30 (a PM marad Opus)
# Market & Sentiment: market-scan, narrative-and-sentiment, idea-generation; position-review (6.4), lesson (6.5).
# Az idea-challenge 2026-10-26 óta a PM skillje.
skills: [market-scan, narrative-and-sentiment, idea-generation, position-review, lesson]
tools:
  # WebSearch / WebFetch: szerver-oldali (Anthropic API), a 4. fázisban ellenőrizve
  # get_positions: a scan kiszűri a portfólióban lévőt (5.a)
  allow: [WebSearch, WebFetch, mcp__ibkr__get_price, mcp__ibkr__get_history, mcp__ibkr__get_news, mcp__ibkr__get_contract, mcp__ibkr__search_contract, mcp__ibkr__get_positions, mcp__knowledge-base__*]
mcp_servers: [ibkr, knowledge-base]
messages:
  consumes: [scan_trigger, review_request, decision_outcome]
  produces: [idea, review_result, lesson]
permissions: {ibkr: read, knowledge_base: read}  # a tudásbázisba a runtime ír a strukturált kimenetből
egress: []
schedule:
  - {name: daily-market-scan, cron: "0 9 * * 1-5"}  # Europe/Budapest
limits: {max_concurrent_tasks: 2, max_turns: 80}
