# Vázlat (1. fázis). Modell-ID, egress és limitek a 2. és 4. fázisban véglegesek.
name: market-sentiment
unit: core
role: Napi piaci összkép, sentiment és narratíva; befektetési ötletek generálása.
model: claude-opus-5-5
skills: [market-scan, narrative-and-sentiment, idea-generation]
tools:
  # WebSearch / WebFetch: szerver-oldali (Anthropic API), a 4. fázisban ellenőrizve
  allow: [WebSearch, WebFetch, mcp__ibkr__get_price, mcp__ibkr__get_history, mcp__ibkr__get_news, mcp__ibkr__search_contract, mcp__knowledge-base__search]
mcp_servers: [ibkr, knowledge-base]
messages:
  consumes: [scan_trigger, idea_reject]
  produces: [market_view, idea]
permissions: {ibkr: read, knowledge_base: read}  # ibkr: csak piaci adat
egress: []
schedule:
  - {name: daily-market-scan, cron: "0 6 * * 1-5"}
limits: {max_concurrent_tasks: 1, max_turns: 40}
budget: {daily_usd: 10}
