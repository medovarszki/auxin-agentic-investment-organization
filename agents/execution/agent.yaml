# Determinisztikus service, nem LLM (Mihály, 2026-10-15): verify, kereskedési idő, POST /order az ibkrfacade-en.
# Az egyetlen Auxin-container az ibkr-backend hálózaton (IBKR írási jog).
name: execution
unit: core
kind: deterministic
role: Megbízás-végrehajtás determinisztikusan; paper számla és a PM-döntéssel való egyezés ellenőrzése, csak kereskedési időben.
model: none
skills: []
tools:
  allow: []
messages:
  consumes: [order, execute_pending]
  produces: [fill, order_reject]
permissions: {ibkr: read_write, knowledge_base: read}
egress: []
limits: {max_concurrent_tasks: 1, max_turns: 0}
budget: {daily_usd: 0}
