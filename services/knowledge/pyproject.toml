[project]
name = "auxin-knowledge"
version = "0.1.0"
description = "Auxin knowledge base: decision log, company notes and lessons in Postgres; REST for writes, MCP for reads"
requires-python = ">=3.12"
dependencies = [
    "auxin-schemas",
    "auxin-a2a",
    "alembic==1.20.0",
    "sqlalchemy[asyncio]==2.1.4",
    "asyncpg==0.32.0",
    "fastapi==0.143.2",
    "mcp==2.3.0",
    "uvicorn==0.54.0",
]

[project.scripts]
auxin-knowledge = "auxin_knowledge.app:main"

[tool.uv.sources]
auxin-schemas = { workspace = true }
auxin-a2a = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auxin_knowledge"]
