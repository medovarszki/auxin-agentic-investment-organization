[project]
name = "auxin-scheduler"
version = "0.1.0"
description = "Auxin scheduler: timed A2A triggers (scan, review) and the decision evaluator (closed positions -> decision_outcome)"
requires-python = ">=3.12"
dependencies = [
    "auxin-schemas",
    "auxin-a2a",
    "auxin-runtime",
    "apscheduler==3.11.3",
]

[project.scripts]
auxin-scheduler = "auxin_scheduler.app:main"

[tool.uv.sources]
auxin-schemas = { workspace = true }
auxin-a2a = { workspace = true }
auxin-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auxin_scheduler"]
